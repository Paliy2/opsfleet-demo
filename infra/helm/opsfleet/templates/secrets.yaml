{{- if .Values.components.secrets }}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.secretStore }}
  labels:
    {{- include "opsfleet.labels" (dict "name" "secret-store" "root" .) | nindent 4 }}
spec:
  provider:
    gcpsm:
      projectID: {{ required "gcpProject is required" .Values.gcpProject | quote }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opsfleet-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.secretStore }}
  target:
    name: opsfleet-app
    template:
      data:
        OPSFLEET_LLM_API_KEY: {{ `"{{ .bifrostKey }}"` }}
        OPSFLEET_PII_HASH_SALT: {{ `"{{ .piiSalt }}"` }}
        OPSFLEET_PII_VALUE_KEY: {{ `"{{ .piiValueKey }}"` }}
        OPSFLEET_DATABASE_URL: {{ printf "postgresql+asyncpg://opsfleet:{{ .dbPassword }}@%s:5432/opsfleet" (required "sqlHost is required" .Values.sqlHost) | quote }}
        OPSFLEET_LANGFUSE_PUBLIC_KEY: {{ `"{{ .langfusePublicKey }}"` }}
        OPSFLEET_LANGFUSE_SECRET_KEY: {{ `"{{ .langfuseSecretKey }}"` }}
  data:
    {{- include "opsfleet.remoteRef" (dict "key" "bifrostKey" "secret" "bifrost-virtual-key") | nindent 4 }}
    {{- include "opsfleet.remoteRef" (dict "key" "piiSalt" "secret" "pii-hash-salt") | nindent 4 }}
    {{- include "opsfleet.remoteRef" (dict "key" "piiValueKey" "secret" "pii-value-key") | nindent 4 }}
    {{- include "opsfleet.remoteRef" (dict "key" "dbPassword" "secret" "db-opsfleet-password") | nindent 4 }}
    {{- include "opsfleet.remoteRef" (dict "key" "langfusePublicKey" "secret" "langfuse-public-key") | nindent 4 }}
    {{- include "opsfleet.remoteRef" (dict "key" "langfuseSecretKey" "secret" "langfuse-secret-key") | nindent 4 }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bifrost
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.secretStore }}
  target:
    name: bifrost
    template:
      data:
        GEMINI_API_KEY: {{ `"{{ .geminiKey }}"` }}
        BIFROST_VIRTUAL_KEY: {{ `"{{ .virtualKey }}"` }}
        LANGFUSE_OTEL_AUTH: {{ `"Basic {{ printf \"%s:%s\" .langfusePublicKey .langfuseSecretKey | b64enc }}"` }}
  data:
    {{- include "opsfleet.remoteRef" (dict "key" "geminiKey" "secret" "gemini-api-key") | nindent 4 }}
    {{- include "opsfleet.remoteRef" (dict "key" "virtualKey" "secret" "bifrost-virtual-key") | nindent 4 }}
    {{- include "opsfleet.remoteRef" (dict "key" "langfusePublicKey" "secret" "langfuse-public-key") | nindent 4 }}
    {{- include "opsfleet.remoteRef" (dict "key" "langfuseSecretKey" "secret" "langfuse-secret-key") | nindent 4 }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.secretStore }}
  target:
    name: keycloak
  data:
    {{- include "opsfleet.remoteRef" (dict "key" "KC_DB_PASSWORD" "secret" "db-keycloak-password") | nindent 4 }}
    {{- include "opsfleet.remoteRef" (dict "key" "KC_BOOTSTRAP_ADMIN_PASSWORD" "secret" "keycloak-admin-password") | nindent 4 }}
    {{- include "opsfleet.remoteRef" (dict "key" "realm.json" "secret" "keycloak-realm") | nindent 4 }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: chainlit
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.secretStore }}
  target:
    name: chainlit
  data:
    {{- include "opsfleet.remoteRef" (dict "key" "CHAINLIT_AUTH_SECRET" "secret" "chainlit-auth-secret") | nindent 4 }}
    {{- include "opsfleet.remoteRef" (dict "key" "OAUTH_KEYCLOAK_CLIENT_SECRET" "secret" "chainlit-oauth-client-secret") | nindent 4 }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.secretStore }}
  target:
    name: langfuse
    template:
      data:
        DATABASE_URL: {{ printf "postgresql://langfuse:{{ .dbPassword }}@%s:5432/langfuse" .Values.sqlHost | quote }}
        NEXTAUTH_SECRET: {{ `"{{ .nextauthSecret }}"` }}
        SALT: {{ `"{{ .salt }}"` }}
        ENCRYPTION_KEY: {{ `"{{ .encryptionKey }}"` }}
        CLICKHOUSE_PASSWORD: {{ `"{{ .clickhousePassword }}"` }}
        REDIS_AUTH: {{ `"{{ .redisPassword }}"` }}
        S3_ACCESS_KEY: {{ `"{{ .s3AccessKey }}"` }}
        S3_SECRET_KEY: {{ `"{{ .s3SecretKey }}"` }}
        LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: {{ `"{{ .s3AccessKey }}"` }}
        LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: {{ `"{{ .s3SecretKey }}"` }}
        LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: {{ `"{{ .s3AccessKey }}"` }}
        LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: {{ `"{{ .s3SecretKey }}"` }}
        LANGFUSE_S3_BATCH_EXPORT_ACCESS_KEY_ID: {{ `"{{ .s3AccessKey }}"` }}
        LANGFUSE_S3_BATCH_EXPORT_SECRET_ACCESS_KEY: {{ `"{{ .s3SecretKey }}"` }}
        LANGFUSE_INIT_PROJECT_PUBLIC_KEY: {{ `"{{ .publicKey }}"` }}
        LANGFUSE_INIT_PROJECT_SECRET_KEY: {{ `"{{ .secretKey }}"` }}
        LANGFUSE_INIT_USER_PASSWORD: {{ `"{{ .adminPassword }}"` }}
  data:
    {{- include "opsfleet.remoteRef" (dict "key" "dbPassword" "secret" "db-langfuse-password") | nindent 4 }}
    {{- include "opsfleet.remoteRef" (dict "key" "nextauthSecret" "secret" "langfuse-nextauth-secret") | nindent 4 }}
    {{- include "opsfleet.remoteRef" (dict "key" "salt" "secret" "langfuse-salt") | nindent 4 }}
    {{- include "opsfleet.remoteRef" (dict "key" "encryptionKey" "secret" "langfuse-encryption-key") | nindent 4 }}
    {{- include "opsfleet.remoteRef" (dict "key" "clickhousePassword" "secret" "langfuse-clickhouse-password") | nindent 4 }}
    {{- include "opsfleet.remoteRef" (dict "key" "redisPassword" "secret" "langfuse-redis-password") | nindent 4 }}
    {{- include "opsfleet.remoteRef" (dict "key" "s3AccessKey" "secret" "langfuse-s3-access-key") | nindent 4 }}
    {{- include "opsfleet.remoteRef" (dict "key" "s3SecretKey" "secret" "langfuse-s3-secret-key") | nindent 4 }}
    {{- include "opsfleet.remoteRef" (dict "key" "publicKey" "secret" "langfuse-public-key") | nindent 4 }}
    {{- include "opsfleet.remoteRef" (dict "key" "secretKey" "secret" "langfuse-secret-key") | nindent 4 }}
    {{- include "opsfleet.remoteRef" (dict "key" "adminPassword" "secret" "langfuse-admin-password") | nindent 4 }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: temporal-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.secretStore }}
  target:
    name: temporal-db
  data:
    {{- include "opsfleet.remoteRef" (dict "key" "password" "secret" "db-temporal-password") | nindent 4 }}
{{- end }}
