name: opsfleet

services:
  postgres:
    profiles: [core]
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: opsfleet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: opsfleet
    ports: ["${POSTGRES_PORT:-5433}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsfleet"]
      interval: 5s
      retries: 10

  bifrost:
    profiles: [core]
    image: maximhq/bifrost:v2.2.6
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:?set in .env}
      BIFROST_VIRTUAL_KEY: ${BIFROST_VIRTUAL_KEY:?set in .env}
    ports: ["8080:8080"]
    volumes:
      - bifrost-data:/app/data
      - ./bifrost/config.json:/app/data/config.json:ro

  langfuse-web:
    profiles: [obs]
    image: langfuse/langfuse:4
    depends_on: &langfuse-deps
      langfuse-postgres: {condition: service_healthy}
      langfuse-clickhouse: {condition: service_healthy}
      langfuse-redis: {condition: service_healthy}
      langfuse-minio: {condition: service_healthy}
    ports: ["3000:3000"]
    environment: &langfuse-env
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-}
      SALT: ${LANGFUSE_SALT:-}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:-}
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD:-langfuse}@langfuse-postgres:5432/langfuse
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-clickhouse}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: langfuse-redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${LANGFUSE_REDIS_PASSWORD:-langfuse}
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD:-miniosecret}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD:-miniosecret}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      LANGFUSE_INIT_ORG_ID: opsfleet
      LANGFUSE_INIT_ORG_NAME: OpsFleet
      LANGFUSE_INIT_PROJECT_ID: data-agent
      LANGFUSE_INIT_PROJECT_NAME: data-agent
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${OPSFLEET_LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${OPSFLEET_LANGFUSE_SECRET_KEY:-}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_ADMIN_EMAIL:-admin@opsfleet.local}
      LANGFUSE_INIT_USER_NAME: admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_ADMIN_PASSWORD:-}

  langfuse-worker:
    profiles: [obs]
    image: langfuse/langfuse-worker:4
    depends_on: *langfuse-deps
    environment: *langfuse-env

  langfuse-postgres:
    profiles: [obs]
    image: postgres:17
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_DB_PASSWORD:-langfuse}
      POSTGRES_DB: langfuse
    volumes: [langfuse-pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 3s
      retries: 10

  langfuse-clickhouse:
    profiles: [obs]
    image: clickhouse/clickhouse-server:25.12
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-clickhouse}
    volumes: [langfuse-clickhouse:/var/lib/clickhouse]
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      retries: 10

  langfuse-redis:
    profiles: [obs]
    image: redis:7
    command: --requirepass ${LANGFUSE_REDIS_PASSWORD:-langfuse} --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${LANGFUSE_REDIS_PASSWORD:-langfuse}", "ping"]
      interval: 3s
      retries: 10

  langfuse-minio:
    profiles: [obs]
    image: cgr.dev/chainguard/minio
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_PASSWORD:-miniosecret}
    volumes: [langfuse-minio:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      retries: 10

  keycloak:
    profiles: [full]
    image: quay.io/keycloak/keycloak:26.8.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-}
      KEYCLOAK_DEMO_PASSWORD: ${KEYCLOAK_DEMO_PASSWORD:-}
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports: ["8180:8080"]
    volumes:
      - ./keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      retries: 30

  redis:
    profiles: [full]
    image: redis:7.4
    command: ["--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 10

  temporal:
    profiles: [full]
    image: temporalio/temporal:1.5.1
    command: ["server", "start-dev", "--ip", "0.0.0.0"]
    ports: ["7233:7233", "8233:8233"]
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 5s
      retries: 20

  api:
    profiles: [full]
    build: &app-build
      context: ../..
    image: opsfleet-agent:local
    command: ["opsfleet-api"]
    env_file: &app-env-file [../../.env]
    environment: &app-env
      OPSFLEET_ENV: local
      OPSFLEET_DATABASE_URL: postgresql+asyncpg://opsfleet:${POSTGRES_PASSWORD}@postgres:5432/opsfleet
      OPSFLEET_LLM_BASE_URL: http://bifrost:8080/v1
      OPSFLEET_LANGFUSE_HOST: http://langfuse-web:3000
      OPSFLEET_AUTH_ISSUER: http://localhost:8180/realms/opsfleet
      OPSFLEET_AUTH_JWKS_URL: http://keycloak:8080/realms/opsfleet/protocol/openid-connect/certs
      OPSFLEET_AUTH_AUDIENCE: opsfleet-api
      OPSFLEET_REDIS_URL: redis://redis:6379/0
      OPSFLEET_TEMPORAL_ADDRESS: temporal:7233
      OPSFLEET_API_HOST: 0.0.0.0
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/adc.json
    volumes: &app-volumes
      - ${GOOGLE_ADC_FILE:-${HOME}/.config/gcloud/application_default_credentials.json}:/secrets/adc.json:ro
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      keycloak: {condition: service_healthy}
      bootstrap: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz')"]
      interval: 5s
      retries: 20

  worker:
    profiles: [full]
    image: opsfleet-agent:local
    command: ["opsfleet-worker"]
    env_file: *app-env-file
    environment: *app-env
    volumes: *app-volumes
    depends_on:
      postgres: {condition: service_healthy}
      temporal: {condition: service_healthy}

  bootstrap:
    profiles: [full]
    build: *app-build
    image: opsfleet-agent:local
    command: ["opsfleet", "bootstrap"]
    restart: on-failure:3
    env_file: *app-env-file
    environment: *app-env
    volumes: *app-volumes
    depends_on:
      postgres: {condition: service_healthy}
      temporal: {condition: service_healthy}
      bifrost: {condition: service_started}
      worker: {condition: service_started}
      langfuse-web: {condition: service_started}

  ui:
    profiles: [full]
    image: opsfleet-agent:local
    command: ["chainlit", "run", "src/opsfleet_agent/ui/app.py", "--host", "0.0.0.0", "--port", "8000", "--headless"]
    environment:
      OPSFLEET_ENV: local
      OPSFLEET_API_URL: http://api:8000
      OPSFLEET_TRACE_URL: http://localhost:3000/project/data-agent/traces/{trace_id}
      CHAINLIT_AUTH_SECRET: ${CHAINLIT_AUTH_SECRET:-}
    ports: ["8001:8000"]
    tmpfs: [/app/.files:uid=10001]
    depends_on:
      api: {condition: service_healthy}

volumes:
  pgdata:
  bifrost-data:
  langfuse-pgdata:
  langfuse-clickhouse:
  langfuse-minio:
