[project]
name = "opsfleet-agent"
version = "0.1.0"
description = "Data analysis chat agent for retail executives"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "typer>=0.12",
    "rich>=13.9",
    "google-cloud-bigquery>=3.46.1",
    "anyio>=4.15.1",
    "langgraph>=1.2.14",
    "langchain-openai>=1.6.7",
    "langchain-core>=1.6.7",
    "sqlalchemy[asyncio]>=2.1.4",
    "asyncpg>=0.32.0",
    "alembic>=1.20.0",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary]>=3.3.6",
    "matplotlib>=3.11.2",
    "langfuse>=4.17.0",
    "prometheus-client>=0.26.0",
    "langchain>=1",
    "pgvector>=0.5.0",
    "openai>=3.26.1",
]

[project.scripts]
opsfleet = "opsfleet_agent.cli.main:app"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "bandit[toml]>=1.8",
    "import-linter>=2.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opsfleet_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "S", "BLE", "TRY", "PT", "RET", "ARG", "PL", "ERA", "C4", "PIE", "T20", "ASYNC"]
ignore = ["TRY003", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ARG"]
"src/opsfleet_agent/gateways/bigquery/scoped_sql.py" = ["S608"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B608"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["bq: requires BigQuery access", "integration: requires running services"]
addopts = "-m 'not bq and not integration'"

[tool.importlinter]
root_package = "opsfleet_agent"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Hexagonal layers"
type = "layers"
layers = [
    "opsfleet_agent.api | opsfleet_agent.cli",
    "opsfleet_agent.agents",
    "opsfleet_agent.repos | opsfleet_agent.gateways",
    "opsfleet_agent.interactors",
    "opsfleet_agent.ports",
    "opsfleet_agent.models | opsfleet_agent.entities",
    "opsfleet_agent.core",
]

[[tool.importlinter.contracts]]
name = "Interactors stay pure"
type = "forbidden"
source_modules = ["opsfleet_agent.interactors"]
forbidden_modules = [
    "opsfleet_agent.models",
    "opsfleet_agent.repos",
    "opsfleet_agent.gateways",
    "opsfleet_agent.agents",
    "sqlalchemy",
    "langgraph",
    "google",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Google Cloud SDKs only in gateways"
type = "forbidden"
source_modules = [
    "opsfleet_agent.api",
    "opsfleet_agent.cli",
    "opsfleet_agent.agents",
    "opsfleet_agent.interactors",
    "opsfleet_agent.repos",
    "opsfleet_agent.entities",
    "opsfleet_agent.models",
    "opsfleet_agent.core",
]
forbidden_modules = ["google"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Observability vendors only in gateways"
type = "forbidden"
source_modules = [
    "opsfleet_agent.agents",
    "opsfleet_agent.interactors",
    "opsfleet_agent.ports",
    "opsfleet_agent.repos",
    "opsfleet_agent.entities",
    "opsfleet_agent.models",
    "opsfleet_agent.core",
]
forbidden_modules = ["langfuse", "prometheus_client"]
allow_indirect_imports = true
